services:
  - type: web
    name: disasterguard-dashboard
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MQTT_TOPIC
        value: disasterguard/esp32-01/telemetry
      - key: DEVICE_ID
        value: esp32-01
      - key: ML_ADMIN_TOKEN
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
